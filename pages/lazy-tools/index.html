<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>薛定谔的工具箱</title>
    <!-- 相对路径引用资源：dashboard 会重写 src/href，不要手写 /api/plugin/page/content/... -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <div class="page-title">
          <h1 id="heading">薛定谔的工具箱</h1>
          <p id="subheading" class="muted"></p>
        </div>
        <div class="page-actions">
          <span id="state-badge" class="badge badge-neutral">读取中…</span>
          <button id="refresh-button" type="button" class="btn">刷新</button>
        </div>
      </header>

      <div id="page-error" class="alert" hidden></div>

      <section class="cards" id="overview"></section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="playground-title">检索试跑</h2>
          <span class="muted" id="playground-hint"></span>
        </div>
        <div class="playground-controls">
          <input
            id="query-input"
            type="text"
            placeholder="输入一句用户可能会说的话，例如：帮我把这句话回显一下"
            autocomplete="off"
          />
          <label class="field-inline">
            <span id="label-topk">top_k</span>
            <input id="topk-input" type="number" min="1" max="50" step="1" />
          </label>
          <label class="field-inline">
            <span id="label-threshold">阈值</span>
            <input id="threshold-input" type="number" min="0" max="1" step="0.05" />
          </label>
          <button id="search-button" type="button" class="btn btn-primary">试跑</button>
        </div>
        <div id="search-summary" class="muted"></div>
        <div id="search-result"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="tools-title">工具清单</h2>
          <span class="muted" id="tools-summary"></span>
        </div>
        <div class="panel-toolbar">
          <span class="muted" id="tools-hint"></span>
          <button id="enrich-button" type="button" class="btn btn-small">
            用 LLM 补全标签
          </button>
        </div>
        <div class="panel-toolbar summarizer-bar">
          <label class="muted" id="summarizer-label" for="summarizer-select">
            总结模型
          </label>
          <select
            id="summarizer-select"
            class="cmd-select select-wide"
          ></select>
          <input
            id="summarizer-model"
            type="text"
            class="cmd-input"
            placeholder="模型名（可留空）"
          />
          <button id="summarizer-test" type="button" class="btn btn-small">
            测试
          </button>
          <button id="summarizer-save" type="button" class="btn btn-small">
            设为默认
          </button>
          <span class="muted" id="summarizer-hint"></span>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th id="th-name">工具名</th>
                <th id="th-source">来源</th>
                <th id="th-tags">标签（逗号分隔，可直接改）</th>
                <th id="th-ttl">存活</th>
                <th id="th-risk">风险</th>
                <th id="th-desc">描述（可直接改）</th>
                <th id="th-actions"></th>
              </tr>
            </thead>
            <tbody id="tools-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="sources-title">子插件</h2>
          <span class="muted" id="sources-hint"></span>
        </div>
        <div class="panel-toolbar">
          <span class="muted" id="sources-count"></span>
          <button id="rescan-button" type="button" class="btn btn-small">
            重新扫描目录
          </button>
        </div>
        <div id="sources-list" class="sources"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="sessions-title">会话激活表</h2>
          <span class="muted" id="sessions-summary"></span>
        </div>
        <div id="sessions-list" class="sessions"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="upload-title">上传子插件</h2>
          <span class="muted" id="upload-hint"></span>
        </div>
        <div class="playground-controls">
          <input id="upload-input" type="file" accept=".py,.zip" />
          <button id="upload-button" type="button" class="btn btn-primary">
            安装
          </button>
        </div>
        <div id="upload-result" class="upload-result"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="learning-title">学习与归纳</h2>
          <span class="muted" id="learning-summary"></span>
        </div>
        <div class="panel-toolbar">
          <span class="muted" id="learning-hint"></span>
          <button id="learning-clear-all" type="button" class="btn btn-small btn-danger">
            清空全部学习
          </button>
        </div>
        <div id="learning-body"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="import-title">从已装插件导入</h2>
          <span class="muted" id="import-hint"></span>
        </div>
        <div id="import-body"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="commands-title">指令面板</h2>
          <span class="muted" id="commands-summary"></span>
        </div>
        <div id="commands-body"></div>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!-- 必须是 module 且外部引用：bridge SDK 由 dashboard 注入，先于本脚本执行 -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
